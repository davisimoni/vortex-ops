name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  # Deterministic output: the metric generator, the formatters and the snapshot
  # timestamps all depend on locale and timezone.
  TZ: UTC

jobs:
  quality:
    name: Types, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci`, never `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, so CI cannot silently
      # test a different dependency tree than the one that will be deployed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          CI: "true"

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The E2E job runs against this exact artefact rather than rebuilding, so
      # the suite tests the bundle that would ship, not a second compilation.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Only the browsers the config actually uses, with their system libs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
